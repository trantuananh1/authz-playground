<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Model Permit.io RBAC, ReBAC and ABAC policies in a DSL or JSON file, then check access and run tests in the browser." />
    <meta name="theme-color" content="#16181d" />
    <title>vAuthz · Authorization as a Service</title>
    <script>
      try {
        if (localStorage.getItem("vauthz-playground:v1:theme") === "light") {
          document.documentElement.classList.remove("dark")
          document.documentElement.style.colorScheme = "light"
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
